name: GitHub Actions Demo
run-name: ${{ github.actor }} is testing out GitHub Actions 🚀
on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Verify JDK 21 Installation
      - run: java --version
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Verify Gradle Installation
        run: gradle --version
      - name: Build and Compile Project
        run: gradle clean compileJava compileTestJava --info